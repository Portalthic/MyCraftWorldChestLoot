settings:
  # 可被插件接管的箱子方块类型。
  chest-materials:
  - CHEST
  - TRAPPED_CHEST
  # 家具头颅所有者名称的固定前缀。例如 model:plantegg 会生成绑定键 SKULL:plantegg。
  # 只有在 links 中明确配置了对应绑定键的模型头颅才会被插件接管。
  skull-model-prefix: "model:"
  # 非标准容器使用的默认界面标题与大小。普通箱子和大箱子会自动使用 27/54 格。
  default-gui-title: "&8宝箱"
  default-gui-size: 27
  # 没有匹配世界或区域绑定时使用的后备奖池。留空表示不接管该箱子。
  default-pool: ""
  # 新建奖池时使用的默认冷却秒数与冷却模式。
  default-cooldown-seconds: 3600
  # false 表示每名玩家独立冷却，true 表示箱子全局冷却。
  default-global-reset: false
  # 预留设置，目前不会用占位物品填满空槽位。
  fill-empty-slots: false
  # 设置为 true 时，奖励随机散布在箱子槽位中；false 时从左上角开始排列。
  ShuffleLoot: false
  # 设置为 true 时，一个集合在一次抽取多个奖励时可以重复命中同一个奖励条目。
  # 设置为 false 时，同一个奖励条目在单次集合抽取中最多命中一次。
  AllowDuplicateItemsFromCollections: true
  # 虚拟箱子内容在内存中保留的秒数。
  # 缓存期间再次打开会看到上次剩余物品；缓存过期但仍在冷却时会打开空箱子。
  ForgetInventoryTime: 60
  # 奖励箱界面标题，<name> 会被替换为奖池名或 links 中配置的映射标题。
  ChestName: "&8<name>"
  # 开箱或关箱时执行的默认命令。留空表示不执行，命令开头的 / 可以省略。
  # 字符串可改写为 YAML 列表以依次执行多条命令。
  default-open-console-command: ""
  default-close-console-command: ""
  default-open-player-command: ""
  default-close-player-command: ""

links: {}
# 管理员看向箱子或模型头颅执行 /wcl link <奖池名> 时，插件会自动写入区域绑定。
# 安装 WorldGuard 6.2.2 和配套 WorldEdit 后可使用区域绑定，区域名来自 WorldGuard。
# 缺少区域依赖时 regions 不生效，但 default 和世界直写绑定仍可使用。
# links:
#   <世界名>:
#     regions:
#       <区域名>:
#         <方块名>: <链接的loot名>:<可选界面标题>
#     default:
#       <方块名>: <链接的loot名>:<可选界面标题>
# links:
#   world:
#     regions:
#       dungeon:
#         CHEST: rare:稀有宝箱
#         SKULL:plantegg: rare:茄子宝箱
#     default:
#       CHEST: basic:基础宝箱
#
# 奖池名后的界面标题可以省略；省略时使用奖池原名。标题支持 & 颜色代码。
# default 表示该世界中没有匹配到区域绑定时使用的方块默认奖池；不需要时可以不写。
# 同时兼容 PhatLoots AutoLink 的世界默认绑定写法：
# links:
#   <世界名>:
#     <方块名>: <链接的loot名>:<可选界面标题>
# links:
#   world:
#     CHEST: basic:基础宝箱
#     TRAPPED_CHEST: rare:稀有宝箱

# 奖池从 LootTables/*.yml 加载，文件结构兼容 PhatLoots。

settings-loot-tables:
  # 此处配置优先于 LootTables/<奖池名>.yml 中的同名基础设置。
  # 可选命令字段：open-console-command、close-console-command、
  # open-player-command、close-player-command。未填写时使用 settings 下的默认命令。
  # 支持占位符：<player>、<uuid>、<pool>、<world>、<x>、<y>、<z>。
  SampleLoot:
    Global: false
    # 条件从上到下依次判断，任意一条失败后停止；列表中的多条条件为 AND 关系。
    # 行内支持 >=、<=、>、<、==、!=、&&、|| 和括号，&& 的优先级高于 ||。
    # 示例："%player_level% >= 100 --message 等级未满100级"
    # 原生变量无需调用 PlaceholderAPI：
    # weather 为 sunny、raining 或 thundering，仅支持 == 和 !=。
    # time 可与 0 至 23999 的世界游戏刻数值比较；time == day/night 仅支持 == 和 !=。
    # 与 PhatLoots 一致，day 为 0-13000 及 23850-23999，night 为 13000-23850；边界 13000、23850 同时匹配两者。
    # permission == mycraft.vip 表示拥有权限，!= 表示不拥有，仅支持 == 和 !=。
    # level、experience、health、foodlevel、saturation 支持全部数值比较运算符。
    # >= 也可以按兼容写法写成 =>。
    LootConditions: []
    Name: SampleLoot
    RoundDownTime: false
    # 相对刷新支持 2h、2.5h、2h+30m、0d+2h+0m+0s 等写法。
    Reset: "2h"
  SampleLootZaphkiel:
    Global: false
    LootConditions: []
    Name: SampleLootZaphkiel
    RoundDownTime: false
    # 固定刷新可写单个字符串或列表。
    # daily 表示每天；weekly,<1-7> 表示周几（1=周一，7=周日）。
    # monthly 支持 1 至 31 和负数倒数日期；yearly 使用 <月>/<日>。
    Reset:
    - "daily;7:0:0"
    - "weekly,2;19:0:0"
    - "monthly,-3;19:0:0"
    - "yearly,5/20;19:0:0"
