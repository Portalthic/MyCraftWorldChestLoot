settings:
  # 可被插件接管的箱子方块类型。
  chest-materials:
    - CHEST
    - TRAPPED_CHEST
  # 非标准容器使用的后备界面标题与大小。普通箱子和大箱子会自动使用 27/54 格。
  gui-title: "&8宝箱"
  gui-size: 27
  # 没有匹配世界或区域绑定时使用的后备奖池。留空表示不接管该箱子。
  default-pool: ""
  # 新建奖池时使用的默认冷却秒数与冷却模式。
  default-cooldown-seconds: 3600
  # false 表示每名玩家独立冷却，true 表示箱子全局冷却。
  default-global-reset: false
  # 预留设置，目前不会用占位物品填满空槽位。
  fill-empty-slots: false

# 设置为 true 时，生成的奖励会随机散布在箱子槽位中；false 时从左上角开始排列。
ShuffleLoot: false

# 虚拟箱子内容在内存中保留的秒数。
# 缓存期间再次打开会看到上次剩余的物品；缓存过期但仍在冷却时会打开空箱子。
ForgetInventoryTime: 60

# 奖励箱界面标题，<name> 会被替换为奖池名称，支持使用 & 颜色代码。
ChestName: "&8<name>"

links: {}
# 管理员看向箱子执行 /wcl link <奖池名> 时，插件会自动写入区域绑定。
# 区域绑定结构如下，其中区域名来自 WorldGuard：
# links:
#   <世界名>:
#     regions:
#       <区域名>:
#         <方块名>: <链接的loot名>:<可选界面标题>
#     default:
#       <方块名>: <链接的loot名>:<可选界面标题>
# links:
#   world:
#     regions:
#       dungeon:
#         CHEST: rare:稀有宝箱
#     default:
#       CHEST: basic:基础宝箱
#
# 奖池名后的界面标题可以省略；省略时使用奖池原名。标题支持 & 颜色代码。
# default 表示该世界中没有匹配到区域绑定时使用的方块默认奖池；不需要时可以不写。
# 同时兼容 PhatLoots AutoLink 的世界默认绑定写法：
# links:
#   <世界名>:
#     <方块名>: <链接的loot名>:<可选界面标题>
# links:
#   world:
#     CHEST: basic:基础宝箱
#     TRAPPED_CHEST: rare:稀有宝箱

# 奖池从 LootTables/*.yml 加载，文件结构兼容 PhatLoots。
